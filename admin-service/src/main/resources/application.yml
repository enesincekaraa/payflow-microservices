spring:
  application:
    name: admin-service
  threads:
    virtual:
      enabled: true

server:
  port: 8085


services:
  account-url: http://localhost:8081
  payment-url: http://localhost:8082


management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always