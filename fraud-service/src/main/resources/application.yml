spring:
  application:
    name: fraud-service
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: fraud-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.payflow.fraudservice.domain.event.PaymentInitiatedEvent
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: "*"

fraud:
  max-amount: 10000          # Bu tutar?n �zeri ?�pheli
  max-transactions: 3        # 1 dakikada bu kadar i?lem ?�pheli
  time-window-seconds: 60    # Zaman penceresi